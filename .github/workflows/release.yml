name: Release

# Builds the single-file Windows exe and attaches it to a GitHub Release.
# Triggered by pushing a tag such as v1.1.1, or manually from the Actions tab
# (Run workflow) with a tag name, which creates the tag and the Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.1.1 (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest

      - name: Run parser tests
        run: python -m pytest test_parser.py -q

      - name: Build single-file exe (same script as local builds)
        shell: cmd
        run: build.bat

      - name: Package zip (exe + README + LICENSE + sample logs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/XMLAuditViewer.exe, README.md, LICENSE package/
          Copy-Item examples package/examples -Recurse
          Compress-Archive -Path package/* -DestinationPath dist/XMLAuditViewer-windows.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XMLAuditViewer-windows
          path: |
            dist/XMLAuditViewer.exe
            dist/XMLAuditViewer-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/XMLAuditViewer.exe
            dist/XMLAuditViewer-windows.zip
          generate_release_notes: true
