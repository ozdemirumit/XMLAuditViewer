name: Release

# Pushing a tag such as v1.1.1 builds the single-file Windows exe and
# attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest

      - name: Run parser tests
        run: python -m pytest test_huawei.py -q

      - name: Build single-file exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --clean
          --name XMLAuditViewer xml_audit_viewer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMLAuditViewer-windows
          path: dist/XMLAuditViewer.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XMLAuditViewer.exe
          generate_release_notes: true
